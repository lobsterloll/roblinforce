[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roblinforce"
version = "0.1.0"
description = "Supervised screen-only reinforcement learning for Roblox driving"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.2,<3",
    "opencv-python>=4.11,<5",
    "mss>=10,<11",
    "pyobjc-framework-Quartz>=10,<13; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.11,<1"]

[project.scripts]
roblinforce = "roblinforce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roblinforce = ["assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/roblinforce"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
